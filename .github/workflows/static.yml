# Workflow for building, minifying and deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Default GITHUB_TOKEN permissions for the official Pages deployment flow.
# "contents: write" is no longer needed -- nothing pushes to a branch anymore.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment. Unlike the previous setup, an in-flight
# deployment is left to finish rather than cancelled, so a live site is never
# interrupted mid-deploy; the next push just queues behind it.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so the generator can date sitemap.xml <lastmod> entries
          # from the last commit that touched each page (see build.mjs).
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # Speeds up repeat runs: npx re-downloads terser/lightningcss, and the
      # generator's dependency (nunjucks) comes from package.json.
      - name: Cache npm downloads
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json', 'package-lock.json') }}-terser-lightningcss
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install generator dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      # Snapshot tests (tests/): block the deploy when anything other than
      # wording changed by accident (markup, links, SEO tags, key wiring,
      # sitemap, language scripts). After an INTENDED structural change run
      # `npm run test:update` locally and commit tests/__snapshots__.
      - name: Test generated output
        run: npm test

      - name: Assemble the site
        run: |
          echo "Copying site files..."
          rsync -av \
            --exclude 'styles.scss' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude '.git/' \
            --exclude 'README.md' \
            --exclude 'LICENSE' \
            --exclude 'src/' \
            --exclude 'content/' \
            --exclude 'tests/' \
            --exclude 'node_modules/' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            . dist
          ls -la dist

      # Generates index.html, privacy.html, 404.html, i18n.js, privacy-i18n.js,
      # sitemap.xml, robots.txt and assets/site.webmanifest from content/*.json
      # + src/ templates (Nunjucks). Runs BEFORE minification so the generated
      # scripts are minified like the rest, and fails the build on missing
      # translations, unresolved tokens or unknown translation keys. Stale-wording warnings show up as annotations
      # on the run; append --strict to make them fail the build too.
      - name: Generate pages from content
        run: node .github/scripts/build.mjs dist

      # Minifies every .js file in place. --compress --mangle only renames
      # LOCAL variable/function names; it leaves global (top-level) names,
      # property names and string literals untouched, so it's safe even
      # without knowing every cross-file reference in i18n.js / scripts.js.
      - name: Minify JavaScript
        run: |
          find dist -type f -name '*.js' | while read -r file; do
            echo "Minifying $file"
            npx --yes terser@5 "$file" --compress --mangle --output "$file.tmp"
            mv "$file.tmp" "$file"
          done

      # clean-css-cli used to run here and was removed: it produced CSS that
      # was byte-for-byte equivalent under every diff/property check we could
      # find, yet demonstrably broke the @keyframes-driven raindrop animation
      # in a real browser, and the cause couldn't be pinned down.
      #
      # Lightning CSS (the Rust/Parcel minifier) replaces it. It's a real CSS
      # parser rather than clean-css's regex/AST-lite pipeline, so it doesn't
      # perform the kind of speculative keyframe/selector merging that broke
      # the animation. No --targets is passed on purpose: with no browser
      # targets, Lightning CSS only minifies (whitespace, safe value
      # shorthanding) and does not try to transpile or polyfill anything --
      # so modern syntax already in use here (color-mix(), @property) is
      # left semantically untouched rather than rewritten for older browsers.
      # Runs before inlining, so what actually ends up in the <style> tag
      # inlined into index.html and privacy.html is the minified CSS.
      - name: Minify CSS with Lightning CSS
        run: |
          npx --yes lightningcss-cli --minify dist/styles.css -o dist/styles.min.css
          mv dist/styles.min.css dist/styles.css

      - name: Report size savings
        run: |
          echo "Minified sizes:"
          find dist -type f \( -name '*.js' -o -name '*.css' \) -exec du -h {} \;

      # Folds the (already-minified) styles.css into every HTML page that
      # links it, so the browser gets CSS in the same response as the page
      # instead of a second network round trip. Removes the now-unused
      # styles.css afterward. Fails the build (rather than deploying broken
      # pages) if the markup doesn't match what this script expects --
      # see .github/scripts/inline-css.js for the exact checks.
      - name: Inline CSS into HTML
        run: node .github/scripts/inline-css.js dist

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Deploy job -- separate from build, as GitHub's own Pages template
  # recommends, so the deployment shows up with its own URL and status
  # under the "github-pages" environment.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
