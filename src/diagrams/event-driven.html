<svg
                  class="arch-diagram{% if a._first %} is-active{% endif %}"
                  data-arch-panel="event-driven"
                  viewBox="0 0 600 260"
                  preserveAspectRatio="xMidYMid meet"
                  role="img"
                  focusable="false"
                  aria-label="{{ a.description.enText | e }}"
                  data-i18n-attr="aria-label:{{ a.description.key }}"
                  {% if not a._first %}aria-hidden="true"{% endif %}
                >
                  <path
                    class="arch-line-solid arch-c-green"
                    d="M70,90 C140,90 170,100 230,102"
                  />

                    class="arch-line-solid arch-c-green"
                    d="M70,190 C140,190 170,160 230,158"

                    d="M370,100 C450,100 470,50 540,50"
